name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Run tests
        run: python -m pytest -q
      - name: Pipeline runs end to end on the committed sample
        run: |
          python scripts/01_build_dataset.py --sqlite sample_data/collector_sample.sqlite --db /tmp/sample.duckdb --out /tmp/sample_results
          python scripts/02_train_evaluate.py --db /tmp/sample.duckdb --out /tmp/sample_results
      - name: README numbers match results
        run: python scripts/render_readme.py --check
