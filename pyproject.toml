[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkbus"
version = "1.0.0"
description = "Accuracy of Hong Kong's official real-time bus arrival estimates, and a corrected ETA with intervals"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "urllib3==2.8.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "duckdb==2.0.0",
    "pyarrow==26.0.1",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.67.0", "altair==6.3.0"]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
