# Routes polled by the collector.
#
# KMB: one request per route returns the ETAs of every stop in both
# directions, so all directions are collected at no extra cost.
# Citybus has no route-level endpoint: one request per (stop, route), so a
# subset of stops is chosen per direction (evenly spaced along the route,
# terminus excluded).

poll_interval_seconds = 60
weather_interval_seconds = 600
stops_per_direction = 10          # stops kept per route direction (both operators)
http_timeout_seconds = 10
max_workers = 8

